spring:
  application:
    name: booknetwork
  datasource:
    url: jdbc:postgresql://${BOOKNETWORK_DB_HOST:localhost}:${BOOKNETWORK_DB_PORT:5432}/booknetwork
    username: booknetwork
    password: booknetwork
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 16
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BOOKNETWORK_ISSUER_URI:http://localhost:9090/realms/booknetwork}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${BOOKNETWORK_MAIL_HOST:localhost}
    port: ${BOOKNETWORK_MAIL_PORT:1025}

server:
  port: ${BOOKNETWORK_API_PORT:8088}
  servlet:
    context-path: /api/v1

booknetwork:
  covers:
    directory: ${BOOKNETWORK_COVERS_DIR:./data/covers}

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
